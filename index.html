<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eBird County Maps — Test</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoLZt4S+P6H4=" crossorigin=""><style>html,body{height:100%;margin:0;font-family:Arial,sans-serif}header{padding:12px 16px;background:#183d35;color:white}header strong{font-size:18px}header small{display:block;margin-top:4px}#map{height:calc(100% - 75px);min-height:350px}.pin{background:#145b46;color:#fff;border:2px solid white;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-weight:bold;box-shadow:0 1px 7px #555}.leaflet-div-icon{border:0;background:transparent}.leaflet-popup-content{min-width:220px;max-width:300px;line-height:1.5}.leaflet-popup-content h3{margin:0 0 6px}.leaflet-popup-content a{color:#125c9b}.muted{color:#555;font-size:12px}</style></head><body><header><strong>eBird County Maps — Test</strong><small>Tap a numbered marker for observation details. Sample map, not live alerts.</small></header><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>
const map=L.map('map').setView([46.4,-119.4],7);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',subdomains:'abcd',maxZoom:19}).addTo(map);
const spots=[{name:'Big Flats Habitat Management Unit',county:'WA-Franklin',lat:46.2983226,lng:-118.7888145,birds:[{species:'American Goshawk',date:'Nov 19, 2026',observer:'Jason Fidorra',checklist:'S411695668',frequency:'0.0769%'}]},{name:'Antelope Highway',county:'OR-Wasco',lat:44.84262,lng:-120.90223,birds:[]}];
const bounds=[];
for(const s of spots){const icon=L.divIcon({className:'',html:`<div class="pin">${s.birds.length||'•'}</div>`,iconSize:[38,38],iconAnchor:[19,19]});const nav=`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}`;let html=`<h3>${s.name}</h3><div class="muted">${s.county}</div>`;if(s.birds.length){html+='<ul style="padding-left:18px">';for(const b of s.birds){html+=`<li><b>${b.species}</b><br>${b.date} · ${b.observer}<br>Frequency: ${b.frequency}<br><a href="https://ebird.org/checklist/${b.checklist}" target="_blank" rel="noopener">View eBird checklist</a></li>`;}html+='</ul>';}else{html+='<p class="muted">Location marker only — no sample species assigned.</p>';}html+=`<a href="${nav}" target="_blank" rel="noopener">Directions in Google Maps</a>`;L.marker([s.lat,s.lng],{icon}).addTo(map).bindPopup(html);bounds.push([s.lat,s.lng]);}map.fitBounds(bounds,{padding:[35,35]});
</script></body></html>
